<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>感性Wiki Lite</title>
  <style>
    :root {
      --bg: #f5f2eb;
      --panel: #fffaf0;
      --text: #29241f;
      --muted: #786f63;
      --line: #ddd2c2;
      --accent: #8b6f47;
      --accent2: #b7895d;
      --danger: #b45757;
      --radius: 18px;
      --shadow: 0 14px 34px rgba(68, 45, 24, .12);
    }
    body.dark {
      --bg: #13120f;
      --panel: #211f1a;
      --text: #f5efe4;
      --muted: #b8aa98;
      --line: #3a332a;
      --accent: #d0a66f;
      --accent2: #b98b5f;
      --danger: #e07b7b;
      --shadow: 0 18px 38px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(183,137,93,.22), transparent 34%),
        radial-gradient(circle at 90% 10%, rgba(139,111,71,.16), transparent 30%),
        var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      min-height: 100vh;
    }
    .wrap { width: min(760px, 92vw); margin: 0 auto; padding: 18px 0 56px; }
    header { padding: 10px 0 14px; }
    h1 { margin: 0; font-size: clamp(1.45rem, 6vw, 2.2rem); letter-spacing: .03em; }
    .lead { margin: 8px 0 0; color: var(--muted); line-height: 1.7; font-size: .95rem; }
    .panel {
      background: color-mix(in oklab, var(--panel) 92%, transparent);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      margin: 14px 0;
    }
    .sticky { position: sticky; top: 0; z-index: 5; backdrop-filter: blur(10px); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    input, textarea, select, button {
      font: inherit;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: color-mix(in oklab, var(--panel) 80%, transparent);
    }
    input, textarea, select { width: 100%; }
    textarea { min-height: 150px; resize: vertical; line-height: 1.7; }
    button { cursor: pointer; }
    .btn {
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-weight: 700;
    }
    .btn.sub { background: transparent; color: var(--text); border-color: var(--line); font-weight: 500; }
    .btn.danger { background: var(--danger); color: #fff; }
    .grow { flex: 1 1 220px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 4px 9px; font-size: .78rem; background: transparent; }
    .tag.active { color: #fff; border-color: var(--accent); background: var(--accent); }
    .memo-list { display: grid; gap: 9px; }
    .memo-item { text-align: left; width: 100%; background: color-mix(in oklab, var(--panel) 80%, transparent); }
    .memo-item.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .memo-title { font-weight: 800; margin-bottom: 4px; }
    .meta { color: var(--muted); font-size: .82rem; }
    .viewer-body { white-space: pre-wrap; line-height: 1.8; margin-top: 12px; }
    .empty { color: var(--muted); line-height: 1.7; }
    .hidden { display:none !important; }
    @media (max-width: 520px) {
      .wrap { width: min(94vw, 760px); padding-top: 12px; }
      .panel { padding: 12px; border-radius: 16px; }
      .row > * { flex: 1 1 100%; }
      .row .btn, .row .btn.sub, .row label { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>感性Wiki Lite</h1>
    <p class="lead">スマホで使うための公開用・軽量版です。個人的な初期メモは入れていません。保存はこの端末のブラウザ内だけです。</p>
  </header>

  <section class="panel sticky">
    <div class="row">
      <input id="searchInput" class="grow" placeholder="検索：タイトル・本文・タグ" />
      <select id="sortSelect">
        <option value="new">新しい順</option>
        <option value="old">古い順</option>
        <option value="title">タイトル順</option>
      </select>
    </div>
    <div id="tagChips" class="tags" style="margin-top:10px;"></div>
  </section>

  <section class="panel">
    <div class="row">
      <button class="btn sub" id="themeBtn">🌙/☀ 表示切替</button>
      <button class="btn sub" id="exportBtn">CSVエクスポート</button>
      <label class="btn sub" style="cursor:pointer; text-align:center;">CSVインポート<input id="importInput" type="file" accept=".csv" class="hidden"></label>
    </div>
  </section>

  <section class="panel">
    <h2 id="formTitle">メモを追加</h2>
    <input id="titleInput" placeholder="タイトル" />
    <textarea id="bodyInput" placeholder="本文"></textarea>
    <input id="tagsInput" placeholder="タグ（カンマ区切り）" />
    <div class="row" style="margin-top:10px;">
      <button class="btn" id="saveBtn">保存</button>
      <button class="btn sub hidden" id="cancelBtn">編集キャンセル</button>
    </div>
  </section>

  <section class="panel">
    <h2>タイトル一覧</h2>
    <div id="memoList" class="memo-list"></div>
  </section>

  <section class="panel" id="viewer"></section>
</main>
<script>
const STORAGE_KEY = "kanseiWikiLiteCards";
const THEME_KEY = "kanseiWikiLiteTheme";
const state = { memos: JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"), editingId: null, selectedId: null, search: "", tagFilter: "", sortBy: "new" };
const el = {
  searchInput: document.getElementById("searchInput"), sortSelect: document.getElementById("sortSelect"), tagChips: document.getElementById("tagChips"),
  titleInput: document.getElementById("titleInput"), bodyInput: document.getElementById("bodyInput"), tagsInput: document.getElementById("tagsInput"),
  saveBtn: document.getElementById("saveBtn"), cancelBtn: document.getElementById("cancelBtn"), formTitle: document.getElementById("formTitle"),
  memoList: document.getElementById("memoList"), viewer: document.getElementById("viewer"), themeBtn: document.getElementById("themeBtn"),
  exportBtn: document.getElementById("exportBtn"), importInput: document.getElementById("importInput")
};
const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state.memos));
const parseTags = raw => raw.split(",").map(x => x.trim()).filter(Boolean);
const fmt = d => { const x = new Date(d); return Number.isNaN(x.getTime()) ? d : `${x.getFullYear()}/${String(x.getMonth()+1).padStart(2,"0")}/${String(x.getDate()).padStart(2,"0")}`; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const escCsv = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replaceAll('"','""')}"` : s; };
const csvLine = line => (line.match(/("(?:[^"]|"")*"|[^,]*)/g) || []).filter((_,i,a)=>i<a.length-1).map(v => v.replace(/^"|"$/g, "").replaceAll('""','"'));
function tagsAll(){ return [...new Set(state.memos.flatMap(m => Array.isArray(m.tags) ? m.tags : []))].sort((a,b)=>a.localeCompare(b,"ja")); }
function filtered(){
  const q = state.search.toLowerCase();
  const items = state.memos.filter(m => {
    const tags = Array.isArray(m.tags) ? m.tags : [];
    return (!q || [m.title,m.body,tags.join(" ")].join(" ").toLowerCase().includes(q)) && (!state.tagFilter || tags.includes(state.tagFilter));
  });
  return items.sort((a,b)=>{
    if(state.sortBy === "title") return (a.title||"").localeCompare(b.title||"", "ja");
    const ad = new Date(a.createdAt).getTime() || 0, bd = new Date(b.createdAt).getTime() || 0;
    return state.sortBy === "old" ? ad - bd : bd - ad;
  });
}
function renderTags(){
  el.tagChips.innerHTML = [`<button class="tag ${state.tagFilter===""?"active":""}" data-tag="">すべて</button>`]
    .concat(tagsAll().map(t => `<button class="tag ${state.tagFilter===t?"active":""}" data-tag="${esc(t)}">#${esc(t)}</button>`)).join("");
}
function ensureSelected(items){ if(!items.length){ state.selectedId = null; return; } if(!items.some(m=>m.id===state.selectedId)) state.selectedId = items[0].id; }
function renderList(items){
  el.memoList.innerHTML = items.map(m => `<button class="memo-item ${m.id===state.selectedId?"active":""}" onclick="selectMemo('${m.id}')">
    <div class="memo-title">${esc(m.title || "(無題)")}</div>
    <div class="tags">${(m.tags||[]).slice(0,4).map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}</div>
    <div class="meta">${esc(fmt(m.createdAt || ""))}</div>
  </button>`).join("") || `<p class="empty">まだメモがありません。最初の一枚を作りましょう。</p>`;
}
function renderViewer(items){
  const m = items.find(x => x.id === state.selectedId);
  if(!m){ el.viewer.innerHTML = `<h2>本文</h2><p class="empty">表示するメモを選んでください。</p>`; return; }
  el.viewer.innerHTML = `<h2>${esc(m.title || "(無題)")}</h2>
    <div class="tags">${(m.tags||[]).map(t=>`<button class="tag" onclick="filterTag('${esc(t)}')">#${esc(t)}</button>`).join("")}</div>
    <div class="meta" style="margin-top:8px;">作成日：${esc(m.createdAt || "")}</div>
    <div class="viewer-body">${esc(m.body || "")}</div>
    <div class="row" style="margin-top:14px;"><button class="btn sub" onclick="editMemo('${m.id}')">編集</button><button class="btn danger" onclick="removeMemo('${m.id}')">削除</button></div>`;
}
function render(){ const items = filtered(); ensureSelected(items); renderTags(); renderList(items); renderViewer(items); }
window.selectMemo = id => { state.selectedId = id; render(); };
window.filterTag = tag => { state.tagFilter = tag; render(); };
window.editMemo = id => { const m = state.memos.find(x=>x.id===id); if(!m) return; state.editingId = id; state.selectedId = id; el.formTitle.textContent = "メモを編集"; el.saveBtn.textContent = "更新"; el.cancelBtn.classList.remove("hidden"); el.titleInput.value = m.title || ""; el.bodyInput.value = m.body || ""; el.tagsInput.value = (m.tags||[]).join(", "); scrollTo({top:0, behavior:"smooth"}); };
window.removeMemo = id => { if(!confirm("このメモを削除しますか？")) return; state.memos = state.memos.filter(m=>m.id!==id); save(); render(); };
function resetForm(){ state.editingId = null; el.formTitle.textContent = "メモを追加"; el.saveBtn.textContent = "保存"; el.cancelBtn.classList.add("hidden"); el.titleInput.value = ""; el.bodyInput.value = ""; el.tagsInput.value = ""; }
function saveMemo(){
  const title = el.titleInput.value.trim(), body = el.bodyInput.value.trim(), tags = parseTags(el.tagsInput.value);
  if(!title && !body){ alert("タイトルか本文を入力してください。"); return; }
  if(state.editingId){ const m = state.memos.find(x=>x.id===state.editingId); if(m){ m.title = title; m.body = body; m.tags = tags; state.selectedId = m.id; } }
  else { const m = { id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()), title, body, tags, createdAt: new Date().toLocaleString("ja-JP") }; state.memos.push(m); state.selectedId = m.id; }
  save(); resetForm(); render();
}
function exportCsv(){
  const rows = [["id","title","body","tags","createdAt"], ...state.memos.map(m => [m.id,m.title,m.body,(m.tags||[]).join("|"),m.createdAt])];
  const csv = rows.map(r => r.map(escCsv).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `kansei_wiki_lite_${Date.now()}.csv`; a.click(); URL.revokeObjectURL(a.href);
}
function importCsv(file){
  const reader = new FileReader();
  reader.onload = () => {
    const lines = String(reader.result || "").split(/\r?\n/).filter(Boolean);
    if(lines.length < 2){ alert("CSVが空です。"); return; }
    state.memos = lines.slice(1).map(line => { const v = csvLine(line); return { id: v[0] || String(Date.now()), title: v[1] || "", body: v[2] || "", tags: (v[3]||"").split("|").map(t=>t.trim()).filter(Boolean), createdAt: v[4] || new Date().toLocaleString("ja-JP") }; });
    state.selectedId = null; save(); render();
  };
  reader.readAsText(file, "utf-8");
}
function applyTheme(){ document.body.classList.toggle("dark", (localStorage.getItem(THEME_KEY) || "dark") === "dark"); }
el.saveBtn.addEventListener("click", saveMemo);
el.cancelBtn.addEventListener("click", resetForm);
el.searchInput.addEventListener("input", e => { state.search = e.target.value; render(); });
el.sortSelect.addEventListener("change", e => { state.sortBy = e.target.value; render(); });
el.tagChips.addEventListener("click", e => { const b = e.target.closest("[data-tag]"); if(!b) return; state.tagFilter = b.dataset.tag || ""; render(); });
el.themeBtn.addEventListener("click", () => { localStorage.setItem(THEME_KEY, document.body.classList.contains("dark") ? "light" : "dark"); applyTheme(); });
el.exportBtn.addEventListener("click", exportCsv);
el.importInput.addEventListener("change", e => { const f = e.target.files?.[0]; if(f) importCsv(f); e.target.value = ""; });
applyTheme(); render();
</script>
</body>
</html>
