<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#8b6f47" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>感性Wiki Lite</title>
  <style>
    :root {
      --bg: #f5f2eb;
      --panel: #fffaf0;
      --text: #29241f;
      --muted: #786f63;
      --line: #ddd2c2;
      --accent: #8b6f47;
      --accent2: #b7895d;
      --danger: #b45757;
      --radius: 18px;
      --shadow: 0 14px 34px rgba(68, 45, 24, .12);
    }
    body.dark {
      --bg: #13120f;
      --panel: #211f1a;
      --text: #f5efe4;
      --muted: #b8aa98;
      --line: #3a332a;
      --accent: #d0a66f;
      --accent2: #b98b5f;
      --danger: #e07b7b;
      --shadow: 0 18px 38px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(183,137,93,.22), transparent 34%),
        radial-gradient(circle at 90% 10%, rgba(139,111,71,.16), transparent 30%),
        var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      min-height: 100vh;
    }
    .wrap { width: min(760px, 92vw); margin: 0 auto; padding: 18px 0 56px; }
    header { padding: 10px 0 14px; }
    h1 { margin: 0; font-size: clamp(1.45rem, 6vw, 2.2rem); letter-spacing: .03em; }
    .lead { margin: 8px 0 0; color: var(--muted); line-height: 1.7; font-size: .95rem; }
    .panel {
      background: color-mix(in oklab, var(--panel) 92%, transparent);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      margin: 14px 0;
    }
    .sticky { position: sticky; top: 0; z-index: 5; backdrop-filter: blur(10px); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    input, textarea, select, button {
      font: inherit;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: color-mix(in oklab, var(--panel) 80%, transparent);
    }
    input, textarea, select { width: 100%; }
    textarea { min-height: 150px; resize: vertical; line-height: 1.7; }
    button { cursor: pointer; }
    .btn {
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-weight: 700;
    }
    .btn.sub { background: transparent; color: var(--text); border-color: var(--line); font-weight: 500; }
    .btn.danger { background: var(--danger); color: #fff; }
    .grow { flex: 1 1 220px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .filter-tags-wrap { display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
    .tags.filter-tags { align-items: flex-start; }
    .tags.filter-tags.collapsed { overflow: hidden; }
    #tagToggleBtn { align-self: flex-end; min-height: 40px; padding: 8px 14px; font-size: .86rem; }
    .tag { border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 4px 9px; font-size: .78rem; background: transparent; min-height: 32px; }
    .tag.toggle { font-weight: 700; }
    .tag.active { color: #fff; border-color: var(--accent); background: var(--accent); }
    .memo-list { display: grid; gap: 9px; }
    .memo-item { text-align: left; width: 100%; background: color-mix(in oklab, var(--panel) 80%, transparent); }
    .memo-item.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .memo-title { font-weight: 800; margin-bottom: 4px; }
    .meta { color: var(--muted); font-size: .82rem; }
    .viewer-body { white-space: pre-wrap; line-height: 1.8; margin-top: 12px; }
    .empty { color: var(--muted); line-height: 1.7; }
    .hidden { display:none !important; }
    /* 現在未使用のためCSVインポートボタンを非表示 */
    .csv-import-btn { display: none; }
    .image-field { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
    .image-pick { display:inline-flex; align-items:center; justify-content:center; text-align:center; min-height:44px; }
    .image-preview { width:100%; max-width:320px; max-height:220px; object-fit:contain; border:1px solid var(--line); border-radius:12px; margin-top:10px; }
    .memo-thumb { width:88px; height:88px; object-fit:cover; border:1px solid var(--line); border-radius:10px; margin-top:8px; }
    .viewer-image { width:100%; max-width:360px; max-height:260px; object-fit:contain; border:1px solid var(--line); border-radius:12px; margin-top:12px; }
    @media (max-width: 520px) {
      .wrap { width: min(94vw, 760px); padding-top: 12px; }
      .panel { padding: 12px; border-radius: 16px; }
      .row > * { flex: 1 1 100%; }
      .row .btn, .row .btn.sub, .row label { flex: 1 1 auto; }
      .image-field > * { flex: 1 1 100%; }
      .image-preview, .viewer-image { max-width:100%; max-height:220px; }
      .memo-thumb { width:72px; height:72px; }
      #tagToggleBtn { width: 100%; align-self: stretch; }
    }
  </style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>感性Wiki Lite</h1>
    <p class="lead">スマホで使うための公開用・軽量版です。個人的な初期メモは入れていません。保存はこの端末のブラウザ内だけです。ホーム画面に追加すると、初回読み込み後はオフラインでも開けます。</p>
  </header>

  <section class="panel sticky">
    <div class="row">
      <input id="searchInput" class="grow" placeholder="検索：タイトル・本文・タグ" />
      <select id="sortSelect">
        <option value="new">新しい順</option>
        <option value="old">古い順</option>
        <option value="title">タイトル順</option>
      </select>
    </div>
    <div class="filter-tags-wrap" style="margin-top:10px;">
      <div id="tagChips" class="tags filter-tags"></div>
      <button id="tagToggleBtn" class="tag toggle hidden" type="button" aria-expanded="false">もっと見る</button>
    </div>
  </section>

  <section class="panel">
    <div class="row">
      <button class="btn sub" id="themeBtn">🌙/☀ 表示切替</button>
      <button class="btn sub" id="exportBtn">CSVエクスポート</button>
      <label class="btn sub csv-import-btn" style="cursor:pointer; text-align:center;">CSVインポート<input id="importInput" type="file" accept=".csv" class="hidden"></label>
    </div>
  </section>

  <section class="panel">
    <h2 id="formTitle">メモを追加</h2>
    <input id="titleInput" placeholder="タイトル" />
    <textarea id="bodyInput" placeholder="本文"></textarea>
    <input id="tagsInput" placeholder="タグ（カンマ区切り）" />
    <div class="image-field">
      <label class="btn sub image-pick">画像選択<input id="imageInput" type="file" accept="image/*" class="hidden"></label>
      <button class="btn sub hidden" id="clearImageBtn" type="button">画像を外す</button>
    </div>
    <div id="imagePreviewWrap" class="hidden"><img id="imagePreview" class="image-preview" alt="画像プレビュー"></div>
    <div class="row" style="margin-top:10px;">
      <button class="btn" id="saveBtn">保存</button>
      <button class="btn sub hidden" id="cancelBtn">編集キャンセル</button>
    </div>
  </section>

  <section class="panel">
    <h2>タイトル一覧</h2>
    <div id="memoList" class="memo-list"></div>
  </section>

  <section class="panel" id="viewer"></section>
</main>
<script>
const STORAGE_KEY = "kanseiWikiLiteCards";
const THEME_KEY = "kanseiWikiLiteTheme";
const IMAGE_MAX_EDGE = 1200;
const state = { memos: JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"), editingId: null, selectedId: null, search: "", tagFilter: "", sortBy: "new", pendingImage: null, tagsExpanded: false };
const el = {
  searchInput: document.getElementById("searchInput"), sortSelect: document.getElementById("sortSelect"), tagChips: document.getElementById("tagChips"), tagToggleBtn: document.getElementById("tagToggleBtn"),
  titleInput: document.getElementById("titleInput"), bodyInput: document.getElementById("bodyInput"), tagsInput: document.getElementById("tagsInput"),
  saveBtn: document.getElementById("saveBtn"), cancelBtn: document.getElementById("cancelBtn"), formTitle: document.getElementById("formTitle"),
  memoList: document.getElementById("memoList"), viewer: document.getElementById("viewer"), themeBtn: document.getElementById("themeBtn"),
  exportBtn: document.getElementById("exportBtn"), importInput: document.getElementById("importInput"),
  imageInput: document.getElementById("imageInput"), clearImageBtn: document.getElementById("clearImageBtn"), imagePreviewWrap: document.getElementById("imagePreviewWrap"), imagePreview: document.getElementById("imagePreview")
};
const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state.memos));
const parseTags = raw => raw.split(",").map(x => x.trim()).filter(Boolean);
const fmt = d => { const x = new Date(d); return Number.isNaN(x.getTime()) ? d : `${x.getFullYear()}/${String(x.getMonth()+1).padStart(2,"0")}/${String(x.getDate()).padStart(2,"0")}`; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const escCsv = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replaceAll('"','""')}"` : s; };
const csvLine = line => (line.match(/("(?:[^"]|"")*"|[^,]*)/g) || []).filter((_,i,a)=>i<a.length-1).map(v => v.replace(/^"|"$/g, "").replaceAll('""','"'));
function setPreview(src){
  if(!src){ el.imagePreviewWrap.classList.add("hidden"); el.clearImageBtn.classList.add("hidden"); el.imagePreview.removeAttribute("src"); return; }
  el.imagePreview.src = src; el.imagePreviewWrap.classList.remove("hidden"); el.clearImageBtn.classList.remove("hidden");
}
async function resizeImage(file, maxEdge, quality){
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, maxEdge / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * scale)), h = Math.max(1, Math.round(bmp.height * scale));
  const canvas = document.createElement("canvas"); canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(bmp, 0, 0, w, h); bmp.close();
  const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", quality));
  return await new Promise((resolve, reject)=>{ const fr = new FileReader(); fr.onload=()=>resolve(String(fr.result||"")); fr.onerror=()=>reject(fr.error); fr.readAsDataURL(blob || file); });
}
function tagsAll(){ return [...new Set(state.memos.flatMap(m => Array.isArray(m.tags) ? m.tags : []))].sort((a,b)=>a.localeCompare(b,"ja")); }
function filtered(){
  const q = state.search.toLowerCase();
  const items = state.memos.filter(m => {
    const tags = Array.isArray(m.tags) ? m.tags : [];
    return (!q || [m.title,m.body,tags.join(" ")].join(" ").toLowerCase().includes(q)) && (!state.tagFilter || tags.includes(state.tagFilter));
  });
  return items.sort((a,b)=>{
    if(state.sortBy === "title") return (a.title||"").localeCompare(b.title||"", "ja");
    const ad = new Date(a.createdAt).getTime() || 0, bd = new Date(b.createdAt).getTime() || 0;
    return state.sortBy === "old" ? ad - bd : bd - ad;
  });
}
function renderTags(){
  const tags = [`<button class="tag ${state.tagFilter===""?"active":""}" data-tag="">すべて</button>`]
    .concat(tagsAll().map(t => `<button class="tag ${state.tagFilter===t?"active":""}" data-tag="${esc(t)}">#${esc(t)}</button>`));
  el.tagChips.innerHTML = tags.join("");

  const chips = [...el.tagChips.querySelectorAll(".tag")];
  if(!chips.length){
    el.tagToggleBtn.classList.add("hidden");
    el.tagChips.classList.remove("collapsed");
    el.tagChips.style.maxHeight = "none";
    return;
  }

  const rowHeight = Math.max(...chips.map(chip => chip.offsetHeight));
  const styles = getComputedStyle(el.tagChips);
  const gap = parseFloat(styles.rowGap || styles.gap || "0") || 0;
  const collapsedHeight = rowHeight * 2 + gap;

  el.tagChips.classList.add("collapsed");
  el.tagChips.style.maxHeight = `${collapsedHeight}px`;
  const hasOverflow = el.tagChips.scrollHeight > collapsedHeight + 1;

  if(hasOverflow){
    el.tagToggleBtn.classList.remove("hidden");
    el.tagToggleBtn.textContent = state.tagsExpanded ? "閉じる" : "もっと見る";
    el.tagToggleBtn.setAttribute("aria-expanded", state.tagsExpanded ? "true" : "false");
  }else{
    el.tagToggleBtn.classList.add("hidden");
    state.tagsExpanded = false;
  }

  if(state.tagsExpanded && hasOverflow){
    el.tagChips.classList.remove("collapsed");
    el.tagChips.style.maxHeight = "none";
  }else if(!hasOverflow){
    el.tagChips.classList.remove("collapsed");
    el.tagChips.style.maxHeight = "none";
  }
}
function ensureSelected(items){ if(!items.length){ state.selectedId = null; return; } if(!items.some(m=>m.id===state.selectedId)) state.selectedId = items[0].id; }
function renderList(items){
  el.memoList.innerHTML = items.map(m => `<button class="memo-item ${m.id===state.selectedId?"active":""}" onclick="selectMemo('${m.id}')">
    <div class="memo-title">${esc(m.title || "(無題)")}</div>
    <div class="tags">${(m.tags||[]).slice(0,4).map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}</div>
    <div class="meta">${esc(fmt(m.createdAt || ""))}</div>
    ${m.image ? `<img class="memo-thumb" src="${esc(m.image)}" alt="サムネイル">` : ""}
  </button>`).join("") || `<p class="empty">まだメモがありません。最初の一枚を作りましょう。</p>`;
}
function renderViewer(items){
  const m = items.find(x => x.id === state.selectedId);
  if(!m){ el.viewer.innerHTML = `<h2>本文</h2><p class="empty">表示するメモを選んでください。</p>`; return; }
  el.viewer.innerHTML = `<h2>${esc(m.title || "(無題)")}</h2>
    <div class="tags">${(m.tags||[]).map(t=>`<button class="tag" onclick="filterTag('${esc(t)}')">#${esc(t)}</button>`).join("")}</div>
    <div class="meta" style="margin-top:8px;">作成日：${esc(m.createdAt || "")}</div>
    <div class="viewer-body">${esc(m.body || "")}</div>
    ${m.image ? `<img class="viewer-image" src="${esc(m.image)}" alt="添付画像">` : ""}
    <div class="row" style="margin-top:14px;"><button class="btn sub" onclick="editMemo('${m.id}')">編集</button><button class="btn danger" onclick="removeMemo('${m.id}')">削除</button></div>`;
}
function render(){ const items = filtered(); ensureSelected(items); renderTags(); renderList(items); renderViewer(items); }
window.selectMemo = id => { state.selectedId = id; render(); };
window.filterTag = tag => { state.tagFilter = tag; render(); };
window.editMemo = id => { const m = state.memos.find(x=>x.id===id); if(!m) return; state.editingId = id; state.selectedId = id; state.pendingImage = null; el.formTitle.textContent = "メモを編集"; el.saveBtn.textContent = "更新"; el.cancelBtn.classList.remove("hidden"); el.titleInput.value = m.title || ""; el.bodyInput.value = m.body || ""; el.tagsInput.value = (m.tags||[]).join(", "); setPreview(m.image || ""); scrollTo({top:0, behavior:"smooth"}); };
window.removeMemo = id => { if(!confirm("このメモを削除しますか？")) return; state.memos = state.memos.filter(m=>m.id!==id); save(); render(); };
function resetForm(){ state.editingId = null; state.pendingImage = null; el.formTitle.textContent = "メモを追加"; el.saveBtn.textContent = "保存"; el.cancelBtn.classList.add("hidden"); el.titleInput.value = ""; el.bodyInput.value = ""; el.tagsInput.value = ""; el.imageInput.value = ""; setPreview(""); }
function saveMemo(){
  const title = el.titleInput.value.trim(), body = el.bodyInput.value.trim(), tags = parseTags(el.tagsInput.value);
  const editingMemo = state.editingId ? state.memos.find(x=>x.id===state.editingId) : null;
  if(!title && !body && !state.pendingImage && !editingMemo?.image){ alert("タイトル、本文、画像のいずれかを入力してください。"); return; }
  if(state.editingId){ const m = state.memos.find(x=>x.id===state.editingId); if(m){ const nextImage = state.pendingImage?.remove ? "" : (state.pendingImage || m.image || ""); m.title = title; m.body = body; m.tags = tags; m.image = nextImage; state.selectedId = m.id; } }
  else { const m = { id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()), title, body, tags, image: state.pendingImage || "", createdAt: new Date().toLocaleString("ja-JP") }; state.memos.push(m); state.selectedId = m.id; }
  save(); resetForm(); render();
}
function exportCsv(){
  const rows = [["id","title","body","tags","image","createdAt"], ...state.memos.map(m => [m.id,m.title,m.body,(m.tags||[]).join("|"),m.image||"",m.createdAt])];
  const csv = rows.map(r => r.map(escCsv).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `kansei_wiki_lite_${Date.now()}.csv`; a.click(); URL.revokeObjectURL(a.href);
}
function importCsv(file){
  const reader = new FileReader();
  reader.onload = () => {
    const lines = String(reader.result || "").split(/\r?\n/).filter(Boolean);
    if(lines.length < 2){ alert("CSVが空です。"); return; }
    state.memos = lines.slice(1).map(line => { const v = csvLine(line); return { id: v[0] || String(Date.now()), title: v[1] || "", body: v[2] || "", tags: (v[3]||"").split("|").map(t=>t.trim()).filter(Boolean), image: v[4] || "", createdAt: v[5] || new Date().toLocaleString("ja-JP") }; });
    state.selectedId = null; save(); render();
  };
  reader.readAsText(file, "utf-8");
}
function applyTheme(){ document.body.classList.toggle("dark", (localStorage.getItem(THEME_KEY) || "dark") === "dark"); }
el.saveBtn.addEventListener("click", saveMemo);
el.cancelBtn.addEventListener("click", resetForm);
el.searchInput.addEventListener("input", e => { state.search = e.target.value; render(); });
el.sortSelect.addEventListener("change", e => { state.sortBy = e.target.value; render(); });
el.tagToggleBtn.addEventListener("click", () => { state.tagsExpanded = !state.tagsExpanded; render(); });
el.tagChips.addEventListener("click", e => {
  const b = e.target.closest("[data-tag]");
  if(!b) return;
  state.tagFilter = b.dataset.tag || "";
  render();
});
el.themeBtn.addEventListener("click", () => { localStorage.setItem(THEME_KEY, document.body.classList.contains("dark") ? "light" : "dark"); applyTheme(); });
el.exportBtn.addEventListener("click", exportCsv);
el.importInput.addEventListener("change", e => { const f = e.target.files?.[0]; if(f) importCsv(f); e.target.value = ""; });
el.imageInput.addEventListener("change", async e => {
  const f = e.target.files?.[0];
  if(!f) return;
  if(!f.type.startsWith("image/")){ alert("画像ファイルを選択してください。"); e.target.value = ""; return; }
  try { state.pendingImage = await resizeImage(f, IMAGE_MAX_EDGE, 0.88); setPreview(state.pendingImage); }
  catch { alert("画像の読み込みに失敗しました。"); }
  e.target.value = "";
});
el.clearImageBtn.addEventListener("click", () => { state.pendingImage = { remove: true }; setPreview(""); });
function registerServiceWorker(){
  if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
  navigator.serviceWorker.register("./sw.js").catch(error => {
    console.warn("Service worker registration failed", error);
  });
}
applyTheme(); render(); registerServiceWorker();
</script>
</body>
</html>
